{% extends "base.html" %}

{% block title %}403 Access Denied | VITCC LIBRARY{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div style="text-align: center; max-width: 480px; padding: 40px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--danger-bg); color: var(--danger-text); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Access Denied (403)</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">
            Your current account role (<strong>{{ user_role }}</strong>) does not have sufficient administrative privileges to view or perform this action.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
