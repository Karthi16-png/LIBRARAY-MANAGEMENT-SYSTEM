{% extends "base.html" %}

{% block title %}Sign In | VITCC LIBRARY{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 120px);
        position: relative;
    }

    /* Ambient glow elements */
    .ambient-glow-1 {
        position: absolute;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        top: 20%;
        left: 30%;
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
    }

    .ambient-glow-2 {
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
        bottom: 20%;
        right: 30%;
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
    }

    /* Glass Card */
    .login-card {
        width: 100%;
        max-width: 440px;
        background: rgba(17, 24, 39, 0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 40px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        position: relative;
        z-index: 10;
    }

    .login-card:hover {
        border-color: var(--border-hover);
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent-primary);
        background: rgba(59, 130, 246, 0.1);
        padding: 4px 12px;
        border-radius: var(--radius-full);
        border: 1px solid rgba(59, 130, 246, 0.2);
        margin-bottom: 12px;
    }

    .login-title {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-primary);
        margin-bottom: 6px;
    }



    /* Form Fields */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
        letter-spacing: 0.01em;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        width: 18px;
        height: 18px;
        stroke: var(--text-muted);
        stroke-width: 2;
        fill: none;
        pointer-events: none;
    }

    .form-input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        background: rgba(11, 15, 25, 0.6);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.92rem;
        font-family: inherit;
        transition: all 0.15s ease-in-out;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--accent-glow);
        background: rgba(11, 15, 25, 0.9);
    }

    .form-input::placeholder {
        color: var(--text-muted);
    }

    .btn-submit {
        width: 100%;
        padding: 13px;
        font-size: 0.92rem;
        font-weight: 700;
        margin-top: 10px;
    }


</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="login-header">
            <span class="login-badge">
                <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="3"></circle></svg>
                Secure Portal
            </span>
            <h1 class="login-title">VITCC LIBRARY</h1>

        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="e.g. jdoe_admin" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••••••" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">
                Sign In to Dashboard &rarr;
            </button>

            <div style="margin-top: 18px; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
                Don't have an account? 
                <a href="{{ url_for('register') }}" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">
                    Sign Up
                </a>
            </div>
        </form>


    </div>
</div>
{% endblock %}
